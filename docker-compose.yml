name: typio

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-typio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-typio}
      POSTGRES_DB: ${POSTGRES_DB:-typio}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Pour se connecter depuis l'hôte, décommenter :
    # ports:
    #   - "5433:5432"

  migrate:
    build:
      context: .
    command: ["bun", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-typio}:${POSTGRES_PASSWORD:-typio}@db:5432/${POSTGRES_DB:-typio}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-typio}:${POSTGRES_PASSWORD:-typio}@db:5432/${POSTGRES_DB:-typio}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  realtime:
    build:
      context: .
    command: ["bun", "realtime.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-typio}:${POSTGRES_PASSWORD:-typio}@db:5432/${POSTGRES_DB:-typio}
      APP_ORIGIN: http://localhost:3000
      REALTIME_PORT: 3001
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  db-data:
