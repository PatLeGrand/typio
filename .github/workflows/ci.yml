name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Realtime build
        run: bun run build:realtime

  database:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: typio
          POSTGRES_PASSWORD: typio
          POSTGRES_DB: typio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U typio -d typio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://typio:typio@localhost:5432/typio
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply database migrations
        run: bun run db:migrate
      # Seul test qui vérifie le schéma contre un vrai PostgreSQL : index unique
      # sans casse, CHECK, cascade des sessions, purges par lots. Le job `quality`
      # n'a pas de base et l'ignore.
      - name: PostgreSQL integration tests
        run: bun run test src/auth/repositories.integration.test.ts
      - name: Validate local Compose
        run: docker compose config --quiet
      - name: Validate VPS Compose
        env:
          MDP_TYPIO: validation-only
        run: docker compose -f infra/docker-compose.yml config --quiet
